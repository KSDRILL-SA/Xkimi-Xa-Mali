<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Xkimi Xa Mali Foundation">
  <!--
    The Foundation's real mark, as a static file.

    This is a faithful transcription of `packages/ui/src/components/XmmLogo.tsx`
    — the same coin rim, disc, crossed arrows, growth bars and centre medallion
    with the rand and the handshake beneath it. It is duplicated as a file rather
    than rendered from the component because a favicon is requested by the
    browser before any React exists, so the component cannot serve one.

    Static rather than generated through `next/og`: generating the icon per
    request is what returned 500 on every load of the marketing site, because
    Satori produces a buffer sharp cannot read at 32x32. A file has no failure
    mode, is cached, and costs nothing to serve.

    The gradient ids are prefixed `xmm-icon-` because this markup is inlined into
    pages that also render the component, and bare ids like `ring` would collide
    with anything else on the page and silently repaint the wrong element.
  -->
  <defs>
    <!-- Gold ring — top-lit coin effect -->
    <linearGradient id="xmm-icon-ring" x1="25%" y1="0%" x2="75%" y2="100%">
      <stop offset="0%" stop-color="#F5D76E"/>
      <stop offset="40%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>

    <!-- Green disc depth -->
    <radialGradient id="xmm-icon-disc" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#2C5F47" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1B4332" stop-opacity="1"/>
    </radialGradient>

    <!-- Top-left polish -->
    <radialGradient id="xmm-icon-sheen" cx="30%" cy="28%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="xmm-icon-arrow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D76E"/>
      <stop offset="55%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#BF9B30"/>
    </linearGradient>

    <linearGradient id="xmm-icon-center-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D76E"/>
      <stop offset="100%" stop-color="#BF9B30"/>
    </linearGradient>

    <linearGradient id="xmm-icon-bar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5D76E"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
  </defs>

  <!-- Coin rim -->
  <circle cx="50" cy="50" r="49" fill="url(#xmm-icon-ring)"/>
  <circle cx="50" cy="50" r="45" fill="none" stroke="#8B6914" stroke-width="0.6" opacity="0.5"/>

  <!-- Inner disc -->
  <circle cx="50" cy="50" r="43" fill="url(#xmm-icon-disc)"/>

  <!-- Green arrow, behind -->
  <g transform="translate(50,50) rotate(45)">
    <polygon points="-30,0 -20,-8.5 -20,-3.5 20,-3.5 20,-8.5 30,0 20,8.5 20,3.5 -20,3.5 -20,8.5" fill="#2C5F47" opacity="0.85"/>
  </g>

  <!-- Gold arrow, front -->
  <g transform="translate(50,50) rotate(-45)">
    <polygon points="-30,0 -20,-8.5 -20,-3.5 20,-3.5 20,-8.5 30,0 20,8.5 20,3.5 -20,3.5 -20,8.5" fill="url(#xmm-icon-arrow)"/>
    <polygon points="-30,0 -20,-8.5 -20,-6 20,-6 20,-8.5 30,0" fill="#F5D76E" opacity="0.22"/>
  </g>

  <!-- Growth bars -->
  <rect x="36.5" y="19" width="4.2" height="8.5" rx="1.2" fill="url(#xmm-icon-bar)" opacity="0.6"/>
  <rect x="42.5" y="16" width="4.2" height="11.5" rx="1.2" fill="url(#xmm-icon-bar)" opacity="0.75"/>
  <rect x="48.5" y="12.5" width="4.2" height="15" rx="1.2" fill="url(#xmm-icon-bar)"/>
  <rect x="54.5" y="16.5" width="4.2" height="11" rx="1.2" fill="url(#xmm-icon-bar)" opacity="0.7"/>

  <!-- Centre medallion -->
  <circle cx="50" cy="50" r="14" fill="#1B4332"/>
  <circle cx="50" cy="50" r="13" fill="none" stroke="url(#xmm-icon-center-ring)" stroke-width="1.8"/>
  <circle cx="50" cy="50" r="11.5" fill="none" stroke="#F5D76E" stroke-width="0.4" opacity="0.3"/>

  <!--
    The rand, drawn rather than typed.

    The component sets this as <text> with Georgia. A favicon is rendered by the
    browser with no page fonts loaded and no guarantee Georgia exists at all, so
    typed text would fall back to whatever the platform had and the mark would
    differ between machines. These are the glyph's own outlines, so it is the
    same R everywhere.
  -->
  <g fill="#D4AF37">
    <rect x="44.2" y="43.4" width="2.5" height="12.2" rx="0.5"/>
    <path d="M46.7 43.4h4.6a4.3 4.3 0 0 1 0 8.6h-4.6v-2.4h4.6a1.9 1.9 0 0 0 0-3.8h-4.6z"/>
    <path d="M49.6 51.4l4.3 4.2h-3.3l-4.2-4.2z"/>
  </g>

  <!-- Handshake arc -->
  <path d="M45.5 60 Q50 63.5 54.5 60" stroke="#D4AF37" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.6"/>

  <!-- Polish, last so it sits over everything -->
  <circle cx="50" cy="50" r="43" fill="url(#xmm-icon-sheen)"/>
</svg>
