# Encrypted off-platform backup of the production database.
#
# Why this exists: Neon's point-in-time restore is a feature of one vendor's
# account. It protects against our mistakes; it does not protect against losing
# the account, a billing lapse, or a vendor incident. This workflow is the second
# copy on a second platform, which is the part the 3-2-1 rule actually asks for.
#
# THE KEY DESIGN POINT — asymmetric encryption:
#
#   The dump is encrypted with a PUBLIC key that lives in this file in plain
#   sight. The matching PRIVATE key is never given to GitHub, never a secret in
#   this repository, and never in CI. It lives in the password managers of two
#   office bearers.
#
#   So GitHub runs the backup and stores the backup, and GitHub cannot read the
#   backup. If both this repository and the Neon account were fully compromised,
#   the attacker gets ciphertext. Had we used a symmetric passphrase stored in
#   GitHub Secrets, whoever holds the repository would hold both halves and the
#   encryption would be decoration.
#
#   The cost of this design is real and must be understood: LOSE THE PRIVATE KEY
#   AND EVERY BACKUP IS PERMANENTLY UNREADABLE. That is the trade, and it is the
#   right one, but it means the private key needs the same care as the encryption
#   key ring — see docs/backup-and-restore.md §2.

name: Backup

on:
  schedule:
    # 01:30 UTC daily — 03:30 SAST, after the day's collections have settled.
    - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why this backup is being taken by hand'
        required: false
        default: 'manual'

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  dump:
    name: Dump, encrypt, retain
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Refuse to run without a destination key
        env:
          AGE_PUBLIC_KEY: ${{ vars.BACKUP_AGE_PUBLIC_KEY }}
        run: |
          if [ -z "$AGE_PUBLIC_KEY" ]; then
            echo "::error::BACKUP_AGE_PUBLIC_KEY repository variable is not set."
            echo "An unencrypted backup of members' ID numbers and bank details"
            echo "must never be produced. Refusing to run. See docs/backup-and-restore.md."
            exit 1
          fi

      - name: Install age and a matching Postgres client
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq age curl ca-certificates gnupg
          # Neon tracks recent major versions; the runner's default client can be
          # older, and pg_dump refuses to dump a server newer than itself. The
          # reverse is supported — a newer pg_dump reads an older server fine —
          # so take pgdg's current client rather than pinning a major that Neon
          # will eventually move past, which would fail the backup on the night
          # they upgrade rather than on a night anyone is watching.
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

          # Use the newest client explicitly, by path.
          #
          # Installing pgdg is not enough. `/usr/bin/pg_dump` is Debian's
          # `pg_wrapper`, and the runner image ships PostgreSQL 16 already — so
          # after installing client 18 the wrapper still resolved to 16.15 and
          # pg_dump aborted with "server version mismatch" against a newer Neon.
          # The install step looked completely successful; only the version line
          # gave it away.
          #
          # Sorted with `sort -V` so this keeps working when pgdg moves to 19,
          # rather than pinning a major that Neon will eventually pass.
          PGBIN="$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)"
          echo "PATH=$PGBIN:$PATH" >> "$GITHUB_ENV"
          echo "Using client at: $PGBIN"
          "$PGBIN/pg_dump" --version

      # ── Where the connection string comes from ──────────────────────────
      #
      # Asking Neon, rather than keeping a second copy of the same credential
      # in GitHub. The API key and project id were already here and unused by
      # any workflow.
      #
      # A pasted PRODUCTION_DIRECT_DATABASE_URL was the last thing standing
      # between this repository and having any backup at all, and it is the
      # kind of secret that goes stale quietly: Neon rotates a role's password
      # and the backup starts failing on a night nobody is watching. Derived
      # each run, it cannot drift.
      #
      # `PRODUCTION_DIRECT_DATABASE_URL` still wins when it is set, so pointing
      # the backup at a database Neon does not host stays a matter of adding a
      # secret.
      - name: Resolve the production connection string
        env:
          OVERRIDE: ${{ secrets.PRODUCTION_DIRECT_DATABASE_URL }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: |
          set -euo pipefail

          if [ -n "$OVERRIDE" ]; then
            echo "Using PRODUCTION_DIRECT_DATABASE_URL."
            echo "::add-mask::$OVERRIDE"
            echo "PGCONN=$OVERRIDE" >> "$GITHUB_ENV"
            exit 0
          fi

          if [ -z "$NEON_API_KEY" ] || [ -z "$NEON_PROJECT_ID" ]; then
            echo "::error::No connection string available."
            echo "Set PRODUCTION_DIRECT_DATABASE_URL, or NEON_API_KEY (secret)"
            echo "and NEON_PROJECT_ID (variable). See docs/backup-and-restore.md."
            exit 1
          fi

          API="https://console.neon.tech/api/v2"
          AUTH="Authorization: Bearer $NEON_API_KEY"

          # `--fail-with-body` so an HTTP error is a failure here rather than
          # valid-looking JSON that produces an empty URI three steps later.
          api() {
            curl -sS --fail-with-body -H "$AUTH" -H "Accept: application/json" "$@"
          }

          # The branch that holds the data — not the one called production.
          #
          # This project's default branch IS named `production`, and it is
          # empty. The live application runs on a child branch named `staging`,
          # which carries 97% of the project's compute. Backing up the default
          # branch produced a 900-byte dump of nothing, and only the size guard
          # stopped it being filed as a successful backup.
          #
          # So the branch is chosen by what it contains. Every branch is asked
          # how many tables it has and the fullest wins, which is correct
          # whichever branch that turns out to be and stays correct if the
          # naming is ever untangled. A backup must follow the data, not a
          # label somebody chose months ago.
          DEFAULT_BRANCH=$(api "$API/projects/$NEON_PROJECT_ID/branches"             | jq -r '.branches[] | select(.default == true) | .id' | head -1)

          BRANCH=""
          BEST=0
          BEST_TABLES=0
          echo "Table counts per branch (public schema):"
          for B in $(api "$API/projects/$NEON_PROJECT_ID/branches" | jq -r '.branches[].id'); do
            BNAME=$(api "$API/projects/$NEON_PROJECT_ID/branches"               | jq -r --arg b "$B" '.branches[] | select(.id==$b) | .name')
            BDB=$(api "$API/projects/$NEON_PROJECT_ID/branches/$B/databases" | jq -r '.databases[0].name // empty')
            BROLE=$(api "$API/projects/$NEON_PROJECT_ID/branches/$B/databases" | jq -r '.databases[0].owner_name // empty')
            if [ -z "$BDB" ]; then echo "  $BNAME: no database"; continue; fi
            BURI=$(api "$API/projects/$NEON_PROJECT_ID/connection_uri?branch_id=$B&database_name=$BDB&role_name=$BROLE&pooled=false" | jq -r '.uri')
            echo "::add-mask::$BURI"
            # Tables, then bytes. Both are metadata: `information_schema` and
            # `pg_database_size` describe the database, and neither reads a
            # column value.
            #
            # Table count alone chose wrong on the first successful run. This
            # project has a branch called `preview` marked *schema-only* — 40
            # tables, no rows — beside `staging`, which has the same 40 tables
            # and all the members. Counting tables made them indistinguishable,
            # the tie went to whichever was iterated first, and the run produced
            # a 126KB dump of an empty schema. It passed the 50KB size guard and
            # was recorded as the project's first successful backup.
            #
            # A backup of a schema with no rows is the exact thing this workflow
            # exists to prevent, arriving with a green tick. Size tells them
            # apart in one query and cannot be fooled by a branch that was
            # copied without its data.
            N=$(psql "$BURI" -tAc "select count(*) from information_schema.tables where table_schema='public'" 2>/dev/null || echo 0)
            SZ=$(psql "$BURI" -tAc "select pg_database_size(current_database())" 2>/dev/null || echo 0)
            echo "  $BNAME ($BDB): $N tables, $(( SZ / 1024 )) KB"
            # Tables are the gate; bytes decide. A branch with no tables is not
            # a candidate however much history it carries.
            if [ "$N" -gt 0 ] 2>/dev/null && [ "$SZ" -gt "$BEST" ] 2>/dev/null; then
              BEST="$SZ"; BRANCH="$B"; BEST_TABLES="$N"
            fi
          done

          if [ -z "$BRANCH" ] || [ "$BEST_TABLES" -eq 0 ]; then
            echo "::error::No Neon branch in this project has any tables. Nothing to back up."
            exit 1
          fi

          CHOSEN=$(api "$API/projects/$NEON_PROJECT_ID/branches"             | jq -r --arg b "$BRANCH" '.branches[] | select(.id==$b) | .name')
          echo "Backing up branch '$CHOSEN' — $BEST_TABLES tables, $(( BEST / 1024 )) KB."

          # Said loudly, every night, until somebody fixes the naming. A project
          # whose default branch is empty while the application runs on a child
          # is one accidental promotion away from serving an empty database.
          if [ "$BRANCH" != "$DEFAULT_BRANCH" ]; then
            echo "::warning::The fullest branch ('$CHOSEN') is NOT this project's default branch."
            echo "::warning::Vercel maps production deployments to the DEFAULT branch, which is empty."
            echo "::warning::See docs/backup-and-restore.md — this needs resolving, not working around."
          fi

          # Every branch and every database, by name, before anything is chosen.
          # The first run against this project dumped Neon's default `neondb`,
          # which is empty — 900 bytes, caught by the size guard. What the log
          # did not say was what else existed, so the next guess would have been
          # as blind as the first.
          DBJSON=$(api "$API/projects/$NEON_PROJECT_ID/branches/$BRANCH/databases")
          echo "Databases on branch $BRANCH:"
          echo "$DBJSON" | jq -r '.databases[] | "  \(.name)  owner=\(.owner_name)"'
          DBNAME=$(echo "$DBJSON" | jq -r '.databases[0].name')
          DBROLE=$(echo "$DBJSON" | jq -r '.databases[0].owner_name')
          if [ -z "$DBNAME" ] || [ "$DBNAME" = "null" ]; then
            echo "::error::No database found on Neon branch $BRANCH."
            exit 1
          fi
          echo "Dumping database '$DBNAME' as role '$DBROLE' from the default branch."

          # pooled=false — the pooled endpoint cannot serve pg_dump.
          URI=$(api "$API/projects/$NEON_PROJECT_ID/connection_uri?branch_id=$BRANCH&database_name=$DBNAME&role_name=$DBROLE&pooled=false"             | jq -r '.uri')
          if [ -z "$URI" ] || [ "$URI" = "null" ]; then
            echo "::error::Neon returned no connection URI."
            exit 1
          fi

          # Masked before it is written anywhere. The password is inside it, and
          # a later step that echoes an error must not be able to leak it.
          echo "::add-mask::$URI"
          echo "PGCONN=$URI" >> "$GITHUB_ENV"

      - name: Dump
        run: |
          set -euo pipefail
          if [ -z "${PGCONN:-}" ]; then
            echo "::error::No connection string resolved."
            exit 1
          fi
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          # --no-owner so the dump restores into any role.
          # Custom format so pg_restore can be selective on the way back.
          # Output is never echoed; the connection string must not reach the log.
          pg_dump "$PGCONN" \
            --format=custom \
            --no-owner \
            --no-privileges \
            --file="xxm-${STAMP}.dump" 2> dump.err || {
              echo "::error::pg_dump failed"
              # Print stderr but scrub anything resembling a connection string.
              sed -E 's#postgres(ql)?://[^ ]*#postgres://REDACTED#g' dump.err
              exit 1
            }
          ls -l "xxm-${STAMP}.dump"
          # pg_dump can also warn and still exit 0. Those warnings are the early
          # sign of a dump that is complete in the shell's eyes and wrong in
          # ours, so surface them instead of leaving them in a file nobody reads.
          if [ -s dump.err ]; then
            echo "::warning::pg_dump wrote to stderr despite succeeding:"
            sed -E 's#postgres(ql)?://[^ ]*#postgres://REDACTED#g' dump.err
          fi

      - name: Refuse to keep a dump that is small or unreadable
        run: |
          set -euo pipefail
          SIZE=$(stat -c%s "xxm-${STAMP}.dump")
          echo "Dump size: ${SIZE} bytes"
          # A successful dump of an empty or half-connected database is the
          # failure mode that goes unnoticed for months. 50 KB is far below a
          # real dump of this schema and far above an empty one.
          if [ "$SIZE" -lt 51200 ]; then
            echo "::error::Dump is only ${SIZE} bytes. Treating as a failed backup."
            exit 1
          fi
          # Size proves the file is not empty. It does not prove the archive can
          # be read back, and a corrupt header on a large file passes the check
          # above while being just as unrestorable as an empty one. pg_restore
          # --list parses the custom-format header and the entire table of
          # contents locally, with no server involved, so a truncated or damaged
          # archive fails HERE — on a night when the database still exists —
          # rather than during the one restore we will ever badly need.
          if ! pg_restore --list "xxm-${STAMP}.dump" > toc.txt 2> toc.err; then
            echo "::error::Dump is not a readable pg_restore archive."
            sed -E 's#postgres(ql)?://[^ ]*#postgres://REDACTED#g' toc.err
            exit 1
          fi
          # A readable archive of nothing is still a failed backup: this catches
          # a dump that connected, found no tables, and exited pleased.
          TABLES=$(grep -c ' TABLE DATA ' toc.txt || true)
          echo "Archive lists ${TABLES} table-data entries."
          if [ "$TABLES" -lt 1 ]; then
            echo "::error::Archive contains no table data. Treating as a failed backup."
            exit 1
          fi
          # --list stops after the table of contents, so it proves the archive
          # opens, not that the rows are there — a file truncated or damaged in
          # the data blocks lists perfectly. Converting the whole archive to SQL
          # and discarding it forces every block to be read and decompressed,
          # which is the only check short of an actual restore that touches all
          # the bytes we are about to keep. No server is contacted; --file makes
          # this a local conversion.
          if ! pg_restore --file=/dev/null "xxm-${STAMP}.dump" 2> full.err; then
            echo "::error::Archive header is intact but its contents do not read back."
            sed -E 's#postgres(ql)?://[^ ]*#postgres://REDACTED#g' full.err
            exit 1
          fi
          echo "Archive reads back in full."

      - name: Encrypt to the offline public key
        env:
          AGE_PUBLIC_KEY: ${{ vars.BACKUP_AGE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          age --encrypt --recipient "$AGE_PUBLIC_KEY" \
              --output "xxm-${STAMP}.dump.age" "xxm-${STAMP}.dump"
          # Remove the plaintext before anything else can touch it. dump.err goes
          # with it: pg_dump's own error text can quote the connection string,
          # which is the one secret this job holds.
          SCRATCH="xxm-${STAMP}.dump dump.err toc.txt toc.err full.err"
          # shellcheck disable=SC2086
          shred -u $SCRATCH 2>/dev/null || rm -f $SCRATCH
          ls -l "xxm-${STAMP}.dump.age"

      - name: Retain
        uses: actions/upload-artifact@v7
        with:
          name: xxm-backup-${{ env.STAMP }}
          path: xxm-*.dump.age
          # GitHub's maximum. This is the rolling operational copy, NOT the
          # archival record — a monthly copy must be downloaded and held
          # offline. See docs/backup-and-restore.md §3.
          retention-days: 90
          if-no-files-found: error

      - name: Summary
        env:
          # Through the environment, not `${{ }}` inside the script: an expression
          # expanded into shell source is executed as shell source, and this
          # value is set in repository settings rather than in this file.
          AGE_PUBLIC_KEY: ${{ vars.BACKUP_AGE_PUBLIC_KEY }}
        run: |
          {
            echo "### Backup complete"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Taken | \`${STAMP}\` |"
            echo "| Artifact | \`xxm-backup-${STAMP}\` |"
            echo "| Encrypted to | \`${AGE_PUBLIC_KEY}\` |"
            echo "| Retention here | 90 days |"
            echo ""
            echo "Restoring needs the **private key**, held offline by two office"
            echo "bearers. GitHub cannot read this file."
          } >> "$GITHUB_STEP_SUMMARY"

  # A backup that fails silently is worse than none, because it is believed.
  alert:
    name: Alert on failure
    runs-on: ubuntu-latest
    needs: dump
    if: failure()
    steps:
      - name: Say so loudly
        run: |
          {
            echo "### ⚠️ BACKUP FAILED"
            echo ""
            echo "The production database was **not** backed up on this run."
            echo ""
            echo "Check the \`dump\` job. Common causes:"
            echo "- \`PRODUCTION_DIRECT_DATABASE_URL\` rotated or expired"
            echo "- \`BACKUP_AGE_PUBLIC_KEY\` variable removed"
            echo "- Neon unreachable, or the pgdg client failed to install"
            echo "- The dump came back unreadable or implausibly small"
            echo ""
            echo "Do not ignore this. See \`docs/backup-and-restore.md\`."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Production backup failed — see docs/backup-and-restore.md"
          exit 1
